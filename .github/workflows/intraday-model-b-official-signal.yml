name: Retired Intraday Model B Collector

# Historical B artifacts remain read-only. Model B now shares the canonical
# 14:00 TOP observation with A/C/D; there is no second collection schedule.
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report retired collector
        run: echo "MODEL_B_COLLECTOR_RETIRED; use the canonical Model TOP 14:00 observation. No collection or publication performed."
