name: Retired Model B LIVE Producer

# The Windows independent executor is the sole LIVE collector.
# No schedule or secret-bearing collection remains on GitHub-hosted runners.
on:
  workflow_dispatch:

permissions: {}
concurrency:
  group: intraday-model-b-official-signal
  cancel-in-progress: false
jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report independent executor ownership
        run: echo "LIVE_PRODUCER_RETIRED; independent PC executor owns 14:00. No collection or publication."
