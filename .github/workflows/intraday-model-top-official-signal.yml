name: Intraday Model TOP Official Signal

on:
  schedule:
    # Prewarm at 14:15 KST (05:15 UTC); the runner itself waits for the exact 14:30 collection window.
    # Best effort only: delays beyond the collection window must fail closed.
    - cron: "15 5 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Manual runs default to a non-observational readiness dry-run."
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - connectivity
          - preflight
          - live
      scheduled_at:
        description: "Optional scheduler timestamp for diagnostics only; never overrides the quote clock."
        required: false
        type: string
      trigger_source:
        description: "Optional scheduler identity for diagnostics only."
        required: false
        type: string

concurrency:
  group: intraday-model-top-official-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 40 # prewarm + bounded collection + post-push deployment check
    permissions:
      contents: write
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      INTRADAY_TRIGGER_TYPE: ${{ github.event_name }}
      INTRADAY_SCHEDULED_AT: ${{ inputs.scheduled_at }}
      INTRADAY_TRIGGER_SOURCE: ${{ inputs.trigger_source }}
      TB_AUTOMATION_READ_TOKEN: ${{ secrets.TB_AUTOMATION_READ_TOKEN }}
    steps:
      - name: Record first runner step
        shell: bash
        run: echo "INTRADAY_RUNNER_FIRST_STEP_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: signal
        shell: bash
        run: |
          mode="${{ github.event_name == 'schedule' && 'live' || inputs.mode }}"
          echo "INTRADAY_MODEL_TOP_WORKFLOW event=${{ github.event_name }} mode=$mode run_id=${{ github.run_id }} started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "$mode" = "dry-run" ]; then args="--dry-run"; elif [ "$mode" = "connectivity" ]; then args="--connectivity-preflight"; elif [ "$mode" = "preflight" ]; then args="--preflight"; else args="--wait-for-window"; fi
          set +e
          node scripts/run-intraday-model-top-official-signal.mjs $args 2>&1 | tee intraday-model-top.log
          exit_code=${PIPESTATUS[0]}
          result=$(grep '^INTRADAY_MODEL_TOP_RESULT_JSON=' intraday-model-top.log | tail -1 | cut -d= -f2-)
          if [ -z "$result" ]; then
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            echo "mode=$mode" >> "$GITHUB_OUTPUT"
            echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=$(jq -r '.status' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "signal_date=$(jq -r '.signalDate // ""' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "signal_path=$(jq -r '.signalPath // ""' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "latest_path=$(jq -r '.latestPath // ""' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
      - name: Stage only live observation artifacts
        if: steps.signal.outputs.mode == 'live' && steps.signal.outputs.latest_path != ''
        shell: bash
        run: |
          if [ "${{ steps.signal.outputs.latest_path }}" != "data/intraday-signals/model-top/latest.json" ]; then echo "LIVE_STAGE_PATH_REJECTED" >&2; exit 1; fi
          if [ "${{ steps.signal.outputs.status }}" = "READY" ]; then
            if [[ ! "${{ steps.signal.outputs.signal_date }}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || [ "${{ steps.signal.outputs.signal_path }}" != "data/intraday-signals/model-top/${{ steps.signal.outputs.signal_date }}/1430.json" ]; then echo "LIVE_STAGE_PATH_REJECTED" >&2; exit 1; fi
          fi
          git add -- "${{ steps.signal.outputs.latest_path }}"
          if [ "${{ steps.signal.outputs.status }}" = "READY" ]; then git add -- "${{ steps.signal.outputs.signal_path }}"; fi
          git diff --cached --check
          if git diff --cached --name-only | grep -E '(^|/)(\.env|.*(secret|token|\.tmp|\.lock|\.bak))'; then exit 1; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.signal.outputs.status }}" = "READY" ]; then message="chore(data): publish intraday Model TOP signal"; else message="chore(data): update intraday Model TOP signal status"; fi
          git commit -m "$message"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "LIVE_PUBLICATION_CONFLICT: original signal preserved; no force push." >&2
              exit 1
            fi
            if git push origin HEAD:main; then echo "LIVE_GITHUB_PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; exit 0; fi
            sleep $((attempt * 5))
          done
          echo "LIVE_PUBLICATION_PUSH_FAILED" >&2
          exit 1
      - name: Verify live publication on Vercel
        if: steps.signal.outputs.mode == 'live' && steps.signal.outputs.status == 'READY'
        run: node scripts/verify-live-production-deployment.mjs --date=${{ steps.signal.outputs.signal_date }}
      - name: Fail unsuccessful live observation
        if: steps.signal.outputs.mode == 'live' && steps.signal.outputs.status != 'READY' && steps.signal.outputs.status != 'MARKET_CLOSED'
        run: exit 1
      - name: Fail unsuccessful preflight
        if: steps.signal.outputs.mode == 'preflight' && steps.signal.outputs.status != 'PREFLIGHT_READY'
        run: exit 1
      - name: Fail unsuccessful connectivity preflight
        if: steps.signal.outputs.mode == 'connectivity' && steps.signal.outputs.status != 'CONNECTIVITY_READY'
        run: exit 1
      - name: Fail unsuccessful dry-run
        if: steps.signal.outputs.mode == 'dry-run' && steps.signal.outputs.status != 'DRY_RUN_READY'
        run: exit 1
