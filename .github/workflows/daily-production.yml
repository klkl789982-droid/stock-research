name: Daily production data

on:
  schedule:
    # 20:37 Asia/Seoul (11:37 UTC), weekdays. The pipeline itself verifies a new official market date.
    - cron: "37 11 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run candidate pipeline once
        id: daily
        shell: bash
        run: |
          set +e
          npm run production:daily 2>&1 | tee daily-production.log
          exit_code=${PIPESTATUS[0]}
          result=$(grep '^DAILY_PRODUCTION_RESULT_JSON=' daily-production.log | tail -1 | cut -d= -f2-)
          if [ -z "$result" ]; then
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=$(jq -r '.status' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "reference_date=$(jq -r '.referenceDate // ""' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "manifest_path=$(jq -r '.manifestPath // ""' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "freshness_path=$(jq -r '.freshnessPath // ""' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "promotion_files=$(jq -c '.promotionFiles // []' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
      - name: Mark validated candidate promoted
        if: steps.daily.outputs.status == 'CANDIDATE_VALIDATED'
        run: node scripts/run-daily-production.mjs --mark-promoted=${{ steps.daily.outputs.manifest_path }}
      - name: Stage only allowlisted artifacts
        if: steps.daily.outputs.freshness_path != ''
        shell: bash
        run: |
          git add -- "${{ steps.daily.outputs.freshness_path }}"
          if [ "${{ steps.daily.outputs.status }}" = "CANDIDATE_VALIDATED" ]; then
            jq -r '.[]' <<<'${{ steps.daily.outputs.promotion_files }}' | while IFS= read -r file; do git add -- "$file"; done
          fi
          git diff --cached --check
          if git diff --cached --name-only | grep -E '(^|/)(\.env|.*(secret|token|\.tmp|\.lock|\.bak))' ; then exit 1; fi
      - name: Commit and push atomic promotion
        if: steps.daily.outputs.freshness_path != ''
        shell: bash
        run: |
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.daily.outputs.status }}" = "CANDIDATE_VALIDATED" ]; then message="chore(data): publish daily production ${{ steps.daily.outputs.reference_date }}"; else message="chore(data): update daily TOP freshness"; fi
          git commit -m "$message"
          git push origin HEAD:main
      - name: Upload safe run manifest on no-op or failure
        if: always() && steps.daily.outputs.status != 'CANDIDATE_VALIDATED' && steps.daily.outputs.manifest_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: daily-production-${{ steps.daily.outputs.reference_date || github.run_id }}
          path: ${{ steps.daily.outputs.manifest_path }}
          retention-days: 30
      - name: Fail unsuccessful run
        if: steps.daily.outputs.status == 'FAILED' || steps.daily.outputs.status == 'REVISION_REQUIRES_APPROVAL'
        run: exit 1
